1166=Hmm.  Are you sure you haven't been playing Populous?
1167=Keeper, your Dungeon is emptier than your head
1168=Trick or treat, Keeper?  Buwa ha ha!
1169=You’re taking your time on this one, Keeper.  Scared?
1170=Do you await some ominous sign or portent from the Undergods of Fire and Soil?
1171=The very rock yawns with anticipation of your next fascinating move
1172=Familiarity breeds contempt, Keeper
1173=It is the Witching Hour.  Curses are half-price
1174=Surely, even Dungeon Keepers must retire to a Lair of some description?
1175=Hello? Are you still there?  The Imps are about to lock up
1176=Your nocturnal perseverance has earned you a hidden gaming tip.  GO TO BED!
1177=You know that low, broad, downy-soft item of furniture in the next room?  It has the power to cure fatigue and restore vitality
1178=You’ll go blind, you know
1179=You have an excess of Mistresses.  There’s a word for Keepers like you
1180=Hic! Your creatures demand cakesh and fine winesh
1181=A lost soul has entered your Dungeon.  Oh no, it’s wandered out again
1182=A neutral creature sends word that he can’t make it today
1183=Your Dungeon floor is lumpy.  Order your minions to jump up and down
1184=Hungry Demons cannot reach their toes
1185=The Wizard needs food
1186=Your Dungeon is on an incline.  Angry creatures cannot play marbles
1187=Big monsters!  Big prizes!  I love it!
1188=Your Dungeon is full of yoghurt
1189=Keeper, you have something unpleasant under your fingernail
1190=Micro-piglets stalk your Dungeon.  Beware!
1191=Your Dungeon is damp.  Install central heating
1192=Never eat anything bigger than your own head, Keeper
1193=Your Lair has been re-carpeted
1194=Your minions demand cable
1195=Timing is... ... ...everything
1196=If you were any kind of a real Keeper you would have won by now
1197=Other Keepers never forget their minions' birthdays
1198=One of your Imps does a great impression of you.  He can even do the ears
1199=Smilesville.  Welcome, Keeper.  Before you lies a happy and carefree realm.  The local champion, Lord Antonius, holds the first Portal Gem you require.  Learn how to construct a Dungeon, and build up your forces so that you can crush Lord Antonius and wipe the smile from his face.
1200=Well done, Keeper, you have successfully ended the life of Lord Antonius and you have claimed your first Portal Gem as well.  This is a most promising start.
1201=You have lost your Dungeon Heart to the weakest Lord in the entire Kingdom of Harmonia.  And we had such high hopes for you.
1202=Sing-Song.  A joyous land filled with light and music.  Let us silence their wailing voices once and for all.  This land is defended by Lord Darius, a far tougher opponent than Lord Antonius.  Only by harnessing the forces of dark magic will you defeat him.  Build a Library to attract Warlocks to your cause, and they will reveal to you the secrets of the arcane.
1203=I see you blasted Lord Darius off the face of the Realm - a most entertaining way to claim a Portal Gem.  To hear their singing turn to screaming has been a tremendous joy to my ears.
1204=You lost to the Lord of the Land of Sing-Song, where their motto is 'you hum it and I'll join in'.  Unbelievable!  We really believed in you, but to fall at so pathetic a hurdle - tut, tut, tut.
1205=Ramshackle.  This is a peaceful land but a poor one, since its defender Lord Avaricious has frittered away his riches.  If you can amass enough gold, he will surely be tempted into leaving his fortress and attacking you personally.  Build a Workshop and fill your realm with fiendish Traps and Doors to protect your hard-won Treasuries.  Lure this fool to his doom and claim his Portal Gem.
1206=Corrupting the noble?  Whatever will you think of next, Keeper?  The Sunlit Kingdom of the Heroes draws a little closer with each victory, and this was cleverly fought.  Well done.  Lord Avaricious lies broken before you with his gold in your coffers.  Who says you can't buy happiness?
1207=You did all the hard work - built a Dungeon and raised all that cash - only to watch someone else leave with it.  Not much of success, were you?
1208=Shadygrove.  Your next adversary, Lord Ludwig, is currently patrolling his keep, considering himself and all of his subjects safe in this land.  Known as a cowardly wretch he has always relied on others to do his fighting for him, this is one battle he will not avoid.
1209=Another land corrupted to your cause and for once your minions are as pleased as you are.  Lord Ludwig seemed an old and overweight foe: at his peak he would have been a greater challenge.  Still, you took a gamble and appropriated another Portal Gem.  Well done, Keeper.
1210=It seems that Lord Ludwig’s faith in his followers was justified!  They made mincemeat out of your minions and demolished your Dungeon.  A very poor show indeed.
1211=Elmshadow.  You face a strange quest this time, Keeper, you must not only conquer this land, you must also conquer fear.  Lord Constantine has installed himself as master of all he surveys at 'Keep Fear' and protected himself with powerful Traps.  It is said that all who attempt to depose him turn back at their first attempt, their faces contorted with terror.
1212=Poor Lord Constantine: a worthy adversary, but ultimately a limited one.  I see you have also gained a piece of the Horny Talisman.  Collect all four sections of this mighty artefact and you will gain the services of Horny, furthermore you now have the ability to summon him for a short period of time in the next realm.  A sweet victory, Keeper, and a well won Portal Gem.
1213=A sad end to a promising career, Keeper.  If you are ruled by your fears, how can you rule the Kingdom?  Such a pity...
1214=It seems we are not alone in our quest.  Your main rival is a Keeper called Nemesis.  He also has many lesser Keepers allied to his cause.  You must defeat them all to claim this Kingdom for your own.  Look, there Keeper Dante has revealed himself by invading Lord Titus’ land of Snapdragon.  And there, Keeper Gormagon has made a move on Lord Sigmund of Emberglow.  I feel sure Nemesis will move against us soon, you must be strong to defeat him.
1215=Sweetwater.  This land is protected by the valiant Lord Ironhelm, your minions are currently laying siege to his castle.  Choose the location to the West for a frontal assault, or the location to the East for a cunning ambush.
1216=By attacking the front of the castle you will prevent Lord Ironhelm escaping with the Portal Gem.  But temper your bloodlust, smashing down the gates may not be the best way to storm the keep.
1217=Is the Dark Mistress not an exquisite find?  Beautiful and graceful on the outside cold and deadly as poison on the inside.  Lord Ironhelm seemed quite... overcome when they faced him.  A most delicious victory.
1218=Truly pathetic Keeper, you showed real promise.  I allowed you the use of the Dark Mistress and you allowed your Dungeon Heart to be destroyed.
1219=Word has reached me that our rival Asmodeus is invading Lord Ronin’s land of Woodsong.
1220=Like a rat fleeing a sinking ship, Lord Ironhelm has his escape route already planned.  However, with a regrettably small amount of torture we have learned of his plans and can now halt the cowardly wretches flight.
1221=Your reactions are swift, Keeper.  You gave Lord Ironhelm no real chance to escape at all.  Swift and decisive: you could be the one, yes, you could be the one.
1222=You have the reactions of a Bile Demon drunk on snot wine.  What did I ever see in you?
1223=Emberglow.  In this land, Keeper Gormagon is currently under siege by Lord Sigmund and his allies.  A lack of foresight has found this rival of ours falling foul of both the creatures and the land itself within this treacherous realm.  Although his position now looks irretrievable, perhaps when he falls his old Dungeon will be of some use to us?
1224=You are proving to be a most worthy adversary to your foes Keeper.  A devilish maze and a veritable Horde of Giants easily despatched by your well organised forces.  In addition you have claimed the second part of the Horny Talisman, you are halfway to binding Horny to your cause.  It is a joy to see you live up to your deadly potential.
1225=You know what they say, 'If you can’t stand the heat'...  You’re a pathetic and broken Keeper.  You now await the same fate as Gormagon.
1226=Malachi, a rival allied with Nemesis is besieging Lord Bramble of Goldenglade.  It matters little who wins that fight for when we arrive ultimate victory can only be ours.
1227=Snapdragon.  With your usual cunning you have replaced Keeper Dante as the main aggressor to this land.  Poor Lord Titus doesn't even know who he is fighting.  I hear that Dante was driven out by a powerful group of Wizards who still guard Snapdragon against the return of any evil forces.  Destroying them will make it easier to challenge Lord Titus.
1228=Well done Keeper, even Horny was impressed with this victory.  You assembled a mighty contingent of many creatures and used your limited resources well.
1229=When resources are limited you must use them wisely, not waste them randomly fighting your enemies.  I taught you better than that, fallen one.
1230=The Land of Sparklydell has found itself to be object of Keeper Morgana’s desires, we must keep a close eye on the outcome of that battle, it could prove rather interesting.
1231=Silverstream.  My spies tell me Lord Voss is attempting to escape past us through this realm.  Stop him quickly and decisively before he gains too much support and turns the tables on you.
1232=Puny Lord Voss thought he could coerce enough allies to defeat you, but speed of action is a far greater weapon.
1233=The ambushers became the ambushed.  You should have learned by now how to destroy someone so weak.
1234=Asmodeus has finally defeated Lord Ronin and has installed himself as master of Woodsong, let us ensure his stay there is both short and uncomfortable.
1235=Woodsong.  The Land of Woodsong has been conquered by that weasel of a Keeper Asmodeus who dares to claim the Portal Gem for himself.  Pursued by the Sylvan Elves, Asmodeus has sealed himself and the Portal Gem in his Dungeon and prepares for a long siege.
1236=Asmodeus thought himself secure, and the Sylvan Elves had the weasel trapped.  Neither could have imagined what would befall them at your hands.  Three parts of the Horny Talisman are now yours, need I remind you that with this device you can summon him in an emergency.
1237=Defeated by effeminate elves and a weak Keeper, and you were doing so well.
1238=Nemesis has been sighted, he has challenged the King’s right hand man, Lord Pureheart, and if he defeats him this could present a major obstacle to us.  More importantly, at this present time, the realm of Sparklydell appears to be drawing rival Keepers like a magnet.
1239=Sparklydell.  Here in this land you finally face a challenge worthy of your dark skills.  Keeper Morgana defeated Lord Brutus and was in turn challenged by the most fiendish enemy you have yet to face: the She-Devil Keeper known as Raksha.  The land has since been invaded by more Keepers.  This land is in chaos, with every Keeper fighting for himself.  You must eradicate them all to claim your next Portal Gem.  Choose your path, Keeper...
1240=A fine choice Keeper, you begin in a well defended location, but your resources are limited.  Swiftly assemble your minions and attack before the others grow too strong.
1241=Four powerful and mighty Keepers defeated in a single battle.  News of this crushing defeat has sent waves of panic around the underworld.  Your fearsome reputation strikes terror into the heart of even the noblest souls.
1242=I am greatly disappointed to see you defeated by this group of pathetic wretches.  Perhaps I will offer them an alliance, you are not fit to serve me.
1243=Mixed news, Keeper.  Pureheart and Nemesis are still fighting and I am unsure to which way the battle will end.  Keeper Malachi has defeated poor Lord Bramble, but his kinsmen still hold out in the vain hope of allies arriving.
1244=A most interesting decision you have made Keeper.  You have access to a large amount of solid ground in which to expand.  Use it well as I feel your enemies are greedily eyeing your great tracts of land.
1245=Four powerful and mighty Keepers defeated in a single battle.  News of this crushing defeat has sent waves of panic around the underworld.  Your fearsome reputation strikes terror into the heart of even the noblest souls.
1246=I am greatly disappointed to see you defeated by this group of pathetic wretches.  Perhaps I will offer them an alliance, you are not fit to serve me.
1247=You have chosen the most difficult path Keeper.  There is no Portal available.  To compensate you have arrived with some of your strongest minions.  It would be a terrible shame if another Keeper were to lose his Portal to your fell clutches.  Attack quickly, surprise and slaughter are the means to obtaining this land’s Portal Gem.
1248=Four powerful and mighty Keepers defeated in a single battle.  News of this crushing defeat has sent waves of panic around the underworld.  Your fearsome reputation strikes terror into the heart of even the noblest souls.
1249=I am greatly disappointed to see you defeated by this group of pathetic wretches.  Perhaps I will offer them an alliance, you are not fit to serve me.
1250=Goldenglade.  A powerful rival, Keeper Malachai has wrested control of this land from the goodly Lord Bramble.  Although their enigmatic leader is now dead, Heroic forces are still attempting to hold on to the remains of his kingdom.
1251=An enduring image Keeper, watching the vampire drain lifeblood of those foolish enough to oppose you.  You have provided this realms miserable subjects with the blessed relief of death.
1252=Malachai has proven himself to be your better.  Perhaps he needs the guiding hand of a new mentor.
1253=Lord Pureheart has resisted the onslaught of Nemesis, our rival has retired from battle and I believe he has decided to try and recruit the enigmatic Dark Angels to his cause.  We must hurry to discover their location.  If Nemesis finds them first he will be all but unstoppable.  Harkan and Carrion, two of Nemesis' finest Keepers have begun the quest.
1254=Cherish.  The Monks of Cuthbert the thrice Martyred have gathered to crush the feeble Keeper Malleus.  Whilst being a comparative weakling, Malleus has cunning beyond his years and has allied himself with the Legion of Undead who will fight for him because of the benefits that the Portal Gem will give to them.  He hopes to turn the entire chapter into Vampires, and if he was successful he would be prove to be a powerful adversary.  His plans must be halted.
1255=Turning holy men from the light into the clutches of darkness makes this victory all the sweeter.  At last you have claimed the final part of the Horny Talisman.  Horny will now aid you in every quest you undertake, use him wisely as he is a tremendous drain on your Mana.
1256=So you failed to convert a gaggle of simple minded religious fanatics to your cause, how disappointing.
1257=There are rumours of a dark uprising in the land of Fluttershine.  Apparently Keeper Carrion feels he is close to locating the Dark Angels temple, you must move faster if we are to prevail.
1258=Peachtree.  Great news, Keeper, you have grown so strong, Horny himself has decided that the time is right to join with you at the forefront of battle.  The land of Peachtree flows with magical energy.  To summon your great ally you must capture Lord Tiberius's Mana Vaults.  These will provide you with all the power your black heart craves.
1259=In my long and evil existence I have never witnessed a sight as magnificent as Horny in a full killing frenzy.  With your brains and his brutality all shall kneel before us and beg for mercy.
1260=Even with the power to summon the great Reaper himself, you lie defeated.  You are not worthy of him - your end is deserved, you pathetic wretch.
1261=Great news, Keeper, upon learning of Nemesis' plans to ally with the Dark Angels the King has ordered his three sons to personally ambush and destroy Carrion.  The Princes fought well and although Carrion still breathes he has been turned from his black quest.  We have a little more time than before.
1262=Fluttershine.  This fair land is troubled by talk of a dark uprising within its borders.  If you arrive in time you may be able to enlist the help of the ringleaders and have them aid you in your quest to kill Lord Volstag and claim his Portal Gem as your own.
1263=Too late Keeper, the invasion has been nipped in the bud and those who would have seated themselves upon the throne can now be found imprisoned and under guard.  If they were to be rescued though, I am sure they would have no hesitation in helping you to defeat their conquerors.
1264=Who should have thought such delicate looking creatures could put up such a brave fight?  Eh, Keeper?  Lord Volstag’s Portal Gem is the greatest prize amongst all your victorious campaigns.  Well met, Keeper.
1265=Overcome by the glamour of fairies! Such a sad end.  You will face eternity locked in a cell with your dim-witted Black Knight allies.  I hear the fairies believe singing is a great cure for evil, something I'm sure you will get used to.
1266=The King is becoming very worried about your constant victories, he has now sent the three Princes out into the Kingdom to stir up support against you.  I am sure this will ultimately prove fruitless as fear will keep the populace in check.
1267=The invasion has yet to start, Keeper, and Lord Volstag believes himself to be safe from any attack while within the walls of his castle.  Both he and the Portal Gem he guards are well protected so make sure you have a worthy army before knocking on his front door.
1268=Another Land corrupted, another Lord brutally killed and another Portal Gem to add to the collection Keeper.  Another good day, yes?
1269=Did the pretty little Fairies not let you get past them.  Pathetic, I have better things to do with my time than watch you embarrass yourself.
1270=Stonekeep.  At last the King has decided to move against you, here in the realm of Stonekeep.  He is amassing a mighty force to stand against you led by his most trusted General Lord Pureheart.  A vast fortress has been constructed in which to amass this legion, but a weakness lies within the castles defences, use it to gain access.  Hide your black hearted realm from the Heroes and take Pureheart's kingdom from under his blind and trusting gaze.
1271=Well done Keeper, the king will think twice before challenging you again.  Lord Pureheart was one of his oldest and closest friends.  I would enjoy seeing his face when he learns of his latest defeat and what it has cost him, If I could only remember how to smile.  The surface is so close now, I can almost taste it.
1272=It seems the king was correct to face you here.  His mighty army now stands poised to reclaim this entire realm, and it is all your fault, you have failed me for the last time Keeper!
1273=You could not have defeated Pureheart at a more appropriate time as the path to the temple of the Dark Angels has just become clear.  We should arrive at the same time as Harkan and Carrion who believe they are too far ahead of you to worry.  Nemesis has also revealed himself and is camped to the east of the King's Castle.  Everything is coming together just like we planned.
1274=Moonshrine.  From their infernal thrones the Dark Angels look down upon the lands of men through their Temple.  They hold the Portal Gem and will award it only to those they deem to possess the blackest heart.  Slaughter as many Heroes as you can to win their favour.
1275=With the power of the Dark Angels, no foe can stand against you.  The final victory draws perilously close.  Soon the lands above will feel the grasping claws of darkness.
1276=You failed to gain the favour of the Dark Angels.  Soon this land shall have a new ruler.  Such a pity it was not you.
1277=The princes have failed in their quest to turn your minions against you.  Nemesis' rage at hearing of the loss of the Dark Angels support was apocalyptic to say the least, but I am sure he has a counter plan.  Beware however of overconfidence.  You must still crush Nemesis, find the princes and defeat the King himself.
1278=Cherry Blossom.  At last, you have trapped Keeper Nemesis, here in the ancient realm of Cherry Blossom.  This thorn in our side has challenged us for the last time, show him the power of a true Keeper.  He has taken refuge with his two sons, also Keepers and holds a tenuous grip on the land.  This uneasy alliance is new-born and if Nemesis is shown to be weaker than yourself, his hold over his ambitious kin will surely be broken.
1279=At last Nemesis falls to your overwhelming power.  Now only royalty remains.  You have progressed well, Keeper, I have never known so wise a tactician.
1280=You have defeated many powerful foes, but when it really mattered you proved... a miserable failure.  Courage and nerves of steel are vital weapons in the armoury of any Keeper who desires success, a poor time to come up short on both.
1281=Your quest is nearly over, but where are the Princes Royal?  I feel sure if we can capture or kill them, King Reginald will have no choice but to surrender his Kingdom to you.  Wait - I have just received a message, the Princes have been sighted in Butterscotch, move quickly and stop whatever counter attack Reginald has planned.
1282=Butterscotch.  King Reginald has sent the three Princes Royal to guard this land and warn him if Evil threatens to master it.  Between them the Princes hold the secret of this land's Portal Gem.  Convert these Princes to your side and they will surely reveal it to you.  If any Prince either dies or escapes to his father's side, then the secret of the Portal Gem will be lost to us and we will never reach the Sunlit Kingdom of the Heroes.
1283=A most satisfactory outcome.  To see all these noble born Princes beg for their pitiful existence was most pleasing, most pleasing indeed.  There remains only the final Portal Gem and that is held by King Reginald himself, you now face the ultimate test.  I know you are worthy.
1284=After defeating countless strong Heroes and many demented Keepers, you allow three foppish Princes to evade your pitiful clutches, you were obviously not destined to rule.
1285=Heartland.  The King himself awaits your pleasure, and from what I hear he is not very happy.  It seems he was a little distressed on hearing of your handling of his sons and has sworn to exact a terrible revenge on you.  This is the final battle.  King Reginald is a mighty foe protected by the finest warriors in all Harmonia.  To defeat him is a formidable task, you will need your wits about you and the mightiest force of evil ever assembled.  De-throne this once proud King and claim his throne for yourself.  Let the land above beware, darkness comes and with it all the horrors of the night.  Slaughter King Reginald and his men, claim the last Portal Gem.  Your greatest victory awaits.  Good luck, Keeper.
1286=King Reginald lies broken before you.  With the final Portal Gem comes access to the surface above.  We can escape this hellish underground pit and wreak havoc on the plentiful outside world.  You have overcome all who stood against you and proved yourself worthy to be called Keeper...  Harmonia is a shadow of its former self.  Darkness chases away the light at every turn.  You shall train every one of your minions in the arts of war and destruction bringing a wave of Doom to all who would dare oppose you.
1287=Only now, at the end, do you understand.  You had it all and you let it slip from your grasp.  King Reginald has claimed all the Portal Gems for himself and will use them for the power for good.  I must now return to the darkness below.  You, however, shall remain here as a prisoner of the King.  And I was so sure that you were the one.
