959=Save Game: Save your current game.
960=Computer Assistance Menu: Customise the Computer Assistant.
961=Quit Game: Quit back to the Level Map.
962=Hardware Acceleration: Turn on hardware acceleration.
963=Software Mode: Turn on software mode.
964=Resolution: Change graphics resolution.
965=Gamma: Adjust the gamma settings.
966=Brightness: Adjust the brightness of the screen.
967=Master Volume: Change the overall volume of the game.
968=Voice Volume: Change the voice volume of the game.
969=Music Volume: Change the music volume of the game.
970=Effects Volume: Change the effects volume of the game.
971=Balance: Change the balance of the game between left and right speakers.
972=Tone: Change the tone of the sound.
973=Reverse Channels: Reverse the left and right speaker outputs.
974=Computer Assistant On: Turn on the Computer Assistant.
975=Computer Assistant Off: Turn off the Computer Assistant.
976=Aggressive Computer Assistant: Constructs your Dungeon and always tries to attack the enemy.  LMB select.
977=Defensive Computer Assistant: Constructs your Dungeon but does not attack the enemy.  LMB select.
978=Construction Only Computer Assistant: Digs, places rooms and Traps but does not move creatures.  LMB select.
979=Move Only Computer Assistant: Moves and slaps your creatures.  LMB select.
980=Invert Mouse: Inverts the vertical mouse movements while Possessing a creature.  LMB toggle.
981=Possess Creature mouse sensitivity: Adjusts the sensitivity of the mouse movements when in Possess Creature mode.  LMB toggle.
