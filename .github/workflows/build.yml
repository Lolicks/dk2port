name: DK2Port CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tests
        run: python3 -m unittest tests.test_save tests.test_decompiled_mapping -v
      - name: C++ engine tests
        run: |
          mkdir -p build
          python3 tests/make_fixture_map.py build/fixture.bin
          clang++ -std=c++17 -O2 -Wall -Wextra \
            -o build/engine_tests \
            tests/engine_tests.cpp engine/DK2.cpp engine/GridSimulation.cpp
          ./build/engine_tests build/fixture.bin

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Archive (ad-hoc)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild -project DK2Port.xcodeproj -scheme DK2Port \
            -configuration Release -sdk iphoneos \
            -archivePath build/DK2Port.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/DK2Port.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP" || { echo "no .app in archive"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -q -r DK2Port.ipa Payload)
          ls -lh build/ipa/DK2Port.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DK2Port-IPA
          path: ios/build/ipa/DK2Port.ipa
