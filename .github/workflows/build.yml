name: DK2Port CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python tests
        run: python3 -m unittest tests.test_save tests.test_decompiled_mapping -v
      - name: C++ engine tests
        run: |
          mkdir -p build
          python3 tests/make_fixture_map.py build/fixture.bin
          clang++ -std=c++17 -O2 -Wall -Wextra \
            -o build/engine_tests \
            tests/engine_tests.cpp engine/DK2.cpp engine/GridSimulation.cpp
          ./build/engine_tests build/fixture.bin

  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Stage original resources into app bundle
        run: |
          set -euo pipefail
          mkdir -p ios/DK2Port/Resources/Original
          cp -R game/Data ios/DK2Port/Resources/Original/Data
          python3 tools/import_assets.py --game-root game \
            --out ios/DK2Port/Resources/Assets --skip-audio
          python3 tools/make_integrity.py ios/DK2Port/Resources \
            ios/DK2Port/Resources/Assets/integrity.json
          du -sh ios/DK2Port/Resources
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Archive (ad-hoc)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild -project DK2Port.xcodeproj -scheme DK2Port \
            -configuration Release -sdk iphoneos \
            -archivePath build/DK2Port.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Package IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP=$(find build/DK2Port.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP" || { echo "no .app in archive"; exit 1; }
          cp -R DK2Port/Resources/Assets "$APP/Assets"
          cp -R DK2Port/Resources/Original "$APP/Original"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -q -r DK2Port.ipa Payload)
          ls -lh build/ipa/DK2Port.ipa
      - name: Verify IPA contents
        working-directory: ios
        run: |
          set -euo pipefail
          IPA=build/ipa/DK2Port.ipa
          test -s "$IPA"
          echo "IPA size: $(stat -f%z "$IPA") bytes"
          for f in \
            Payload/DK2Port.app/Original/Data/Meshes.WAD \
            Payload/DK2Port.app/Original/Data/FrontEnd.WAD \
            Payload/DK2Port.app/Original/Data/Movies/INTRO.TGQ \
            Payload/DK2Port.app/Assets/data/stats.json \
            Payload/DK2Port.app/Assets/data/triggers.json \
            Payload/DK2Port.app/Assets/maps/maps.json \
            Payload/DK2Port.app/Assets/integrity.json; do
            unzip -l "$IPA" | grep -q "$f" || { echo "MISSING $f"; exit 1; }
            echo "OK $f"
          done
          if grep -R 'documentDirectory' DK2Port --include='*.swift' \
             | grep -q 'Original'; then
            echo "unexpected Documents/Original dependency"; exit 1
          fi
          echo "No mandatory Documents/Original dependency"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DK2Port-IPA
          path: ios/build/ipa/DK2Port.ipa
      - name: Publish IPA to permanent Release
        working-directory: ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA=build/ipa/DK2Port.ipa
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest "$IPA" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create latest "$IPA" -R "$GITHUB_REPOSITORY" \
              --title "DK2Port — latest build" --generate-notes
          fi
      - name: Refresh STATUS.md and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DK2_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          export DK2_IPA_SIZE="$(stat -f%z ios/build/ipa/DK2Port.ipa)"
          python3 tools/gen_status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          if git diff --cached --quiet; then
            echo "STATUS.md unchanged"
          else
            git commit -m "chore: refresh STATUS.md [skip ci]"
            git push origin HEAD:master
          fi
          gh release edit latest --notes-file STATUS.md -R "$GITHUB_REPOSITORY"
